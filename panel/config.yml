backend:
  name: github
  repo: ferdimen/me
  branch: main

media_folder: "img" # Yüklenen görsellerin gideceği klasör
public_folder: "img"
    
collections:
  - name: "tur_yonetimi"
    label: "Tur Ayarları"
    files:
      - file: "nerdeyim/konum.json" # JSON dosyanızın tam yolu ve adı
        label: "Canlı Tur ve Harita Ayarları"
        name: "tur_ayarlari"
        fields:
          # Evet/Hayır için Checkbox (Boolean) yapıyoruz. JSON'a "evet" veya "hayir" string olarak yazılması için:
          - label: "Aktif Tur Mu?"
            name: "aktifTur"
            widget: "select"
            options:
              - { label: "Evet", value: "evet" }
              - { label: "Hayır", value: "hayir" }

          - { label: "Polarsteps Canlı Takip URL", name: "canliTakipUrl", widget: "string" }
          - { label: "Tur Adı", name: "tur-adi", widget: "string" } # JSON'daki tire işaretli anahtarla birebir aynı
          - { label: "Açıklama", name: "aciklama", widget: "text" }

          - label: "Rota Gösterilsin Mi?"
            name: "rota"
            widget: "select"
            options:
              - { label: "Evet", value: "evet" }
              - { label: "Hayır", value: "hayir" }

          # Sayısal değerler için number widget'ı
          - { label: "Karakter Sınırı", name: "karakter-siniri", widget: "number", value_type: "int" }

          - label: "Yazı Gösterilsin Mi?"
            name: "yazi"
            widget: "select"
            options:
              - { label: "Evet", value: "evet" }
              - { label: "Hayır", value: "hayir" }

          - { label: "Harita Zoom Seviyesi", name: "zoom-seviyesi", widget: "number", value_type: "int" }
          
          # Renk seçimi için panelde harika bir renk paleti açar
          - { label: "Genel Çizgi Rengi", name: "cizgi-rengi", widget: "color" }
