<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Ferdimen // İçerik Yönetim Paneli</title>
    <link rel="icon" href="https://www.ferdimen.com/img/logo.png">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; max-width: 900px; margin: 40px auto; padding: 20px; background: #f4f6f9; }
        .panel-container { display: flex; gap: 20px; margin-top: 20px; }
        .sidebar { flex: 1; max-width: 200px; display: flex; flex-direction: column; gap: 8px; }
        .main-content { flex: 3; background: #fff; padding: 25px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .tab-btn { background: #fff; border: 1px solid #e2e8f0; padding: 12px; cursor: pointer; border-radius: 6px; font-weight: bold; }
        .tab-btn.active { background: #2563eb; color: white; }
        #map { height: 400px; width: 100%; border-radius: 8px; margin-bottom: 20px; border: 1px solid #cbd5e1; }
        .kart { padding: 12px; border: 1px solid #e2e8f0; margin-bottom: 8px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
        .btn { padding: 8px 16px; border-radius: 4px; cursor: pointer; border: none; color: white; font-weight: bold; }
        .btn-duzenle { background: #eab308; }
        .btn-sil { background: #ef4444; }
    </style>
</head>
<body>

<div id="auth-panel" style="text-align:center; margin-top:50px;">
    <h2>Yönetim Paneli Girişi</h2>
    <button onclick="githubGirisYap()" style="padding:15px; cursor:pointer;">GitHub ile Giriş Yap</button>
</div>

<div id="main-panel" style="display: none;">
    <h2>İçerik Yönetim Merkezi</h2>
    <div class="panel-container">
        <div class="sidebar">
            <button class="tab-btn active" onclick="sekmeDegistir('nerdeyim-tab')">📍 Nerdeyim</button>
            <button class="tab-btn" onclick="sekmeDegistir('haberler-tab')">📰 Haberler</button>
            <button class="tab-btn" onclick="sekmeDegistir('yerler-tab')">📍 Yerler</button>
            <button class="tab-btn" onclick="sekmeDegistir('kronoloji-tab')">⏳ Kronoloji</button>
        </div>
        <div class="main-content">
            <div id="status-box" style="padding:10px; margin-bottom:10px; display:none;"></div>
            
            <div id="nerdeyim-tab" class="tab-content active">Konum ayarları...</div>
            <div id="haberler-tab" class="tab-content">Haber yönetimi...</div>
            
            <div id="yerler-tab" class="tab-content">
                <h3>Yer Yönetimi</h3>
                <div id="map"></div>
                <input type="text" id="yer-ara" placeholder="Ara..." onkeyup="yerleriFiltrele()" style="width:100%; padding:10px; margin-bottom:10px;">
                <div id="yerler-listesi"></div>
            </div>

            <div id="kronoloji-tab" class="tab-content">Kronoloji yönetimi...</div>
        </div>
    </div>
</div>

<script>
    const CLIENT_ID = "Ov23liB76WxL18rB8cmu";
    const WORKER_URL = "https://github-oauth.kizilferdi.workers.dev/";
    const REPO_OWNER = "ferdimen";
    const REPO_NAME = "me";
    const PATH_KATEGORILER = "data/yerler/kategoriler.json";
    
    let harita, tumYerler = [];

    function decodeBase64(str) {
        return decodeURIComponent(atob(str).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
    }

    function sekmeDegistir(id) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.currentTarget.classList.add('active');
        if(id === 'yerler-tab' && harita) harita.invalidateSize();
    }

    async function yerleriYukle(token) {
        const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${PATH_KATEGORILER}`, { headers: { "Authorization": `token ${token}` } });
        const data = await res.json();
        const kategoriler = JSON.parse(decodeBase64(data.content));
        
        tumYerler = [];
        for (let kat of kategoriler) {
            const yRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${kat.jsonPath}`, { headers: { "Authorization": `token ${token}` } });
            const yData = await yRes.json();
            const icerik = JSON.parse(decodeBase64(yData.content));
            icerik.places.forEach(p => tumYerler.push({...p, path: kat.jsonPath, sha: yData.sha}));
        }
        haritayiBaslat();
        yerleriListele(tumYerler);
    }

    function haritayiBaslat() {
        if(harita) harita.remove();
        harita = L.map('map').setView([41.0, 28.0], 7);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(harita);
        tumYerler.forEach(yer => {
            L.marker([yer.coordinates.lat, yer.coordinates.lng]).addTo(harita).bindPopup(yer.name);
        });
    }

    function yerleriListele(liste) {
        const div = document.getElementById('yerler-listesi');
        div.innerHTML = liste.map((y, i) => `
            <div class="kart">
                <span>${y.name}</span>
                <div>
                    <button class="btn btn-duzenle" onclick="duzenle(${i})">Düzenle</button>
                    <button class="btn btn-sil" onclick="sil(${i})">Sil</button>
                </div>
            </div>
        `).join('');
    }

    function yerleriFiltrele() {
        const val = document.getElementById('yer-ara').value.toLowerCase();
        yerleriListele(tumYerler.filter(y => y.name.toLowerCase().includes(val)));
    }

    function githubGirisYap() { window.location.href = `https://github.com/login/oauth/authorize?client_id=${CLIENT_ID}&scope=repo`; }

    async function tokenKontrolEt() {
        const code = new URLSearchParams(window.location.search).get('code');
        let token = localStorage.getItem('gh_oauth_token');
        if (code) {
            const res = await fetch(`${WORKER_URL}?code=${code}`);
            const data = await res.json();
            if(data.access_token) {
                token = data.access_token;
                localStorage.setItem('gh_oauth_token', token);
            }
        }
        if (token) {
            document.getElementById('auth-panel').style.display = 'none';
            document.getElementById('main-panel').style.display = 'block';
            yerleriYukle(token);
        }
    }

    tokenKontrolEt();
</script>
</body>
</html>
