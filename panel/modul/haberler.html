<h3 id="haber-form-baslik">➕ Yeni Haber Ekle</h3>
<form id="form-yeni-haber" onsubmit="haberModul.formGonder(event)">
    <input type="hidden" id="h-index" value="-1">
    <div class="form-group">
        <label>Haber Başlığı</label>
        <input type="text" id="h-baslik" required>
    </div>
    <div class="form-row">
        <div class="form-group">
            <label>Tarih</label>
            <input type="date" id="h-tarih" required>
        </div>
        <div class="form-group">
            <label>Etiket</label>
            <input type="text" id="h-etiket" placeholder="Örn: YOL DURUMU">
        </div>
    </div>
    <button type="submit" id="btn-haber-kaydet" class="btn" style="background:#10b981;">Haber Listesine Ekle</button>
</form>

<div id="haberler-listesi-kapsayici" style="margin-top:20px; display:flex; flex-direction:column; gap:10px;"></div>

<script>
const haberModul = {
    path: "data/haber.json",
    sha: "",
    liste: [],

    init: async function() {
        const url = `https://api.github.com/repos/${FerdiAPI.owner}/${FerdiAPI.repo}/contents/${this.path}`;
        try {
            const res = await fetch(url, { headers: { "Authorization": `token ${FerdiAPI.token}` } });
            if(!res.ok) return;
            const data = await res.json();
            this.sha = data.sha;
            this.liste = JSON.parse(FerdiAPI.b64_to_utf8(data.content));
            this.listele();
        } catch(e) { console.error(e); }
    },

    listele: function() {
        const kapsayici = document.getElementById('haberler-listesi-kapsayici');
        kapsayici.innerHTML = "";
        this.liste.forEach((h, i) => {
            const div = document.createElement('div');
            div.className = 'haber-kart';
            div.innerHTML = `
                <div class="haber-kart-detay">
                    <div class="haber-kart-meta">${h.meta}</div>
                    <h4 class="haber-kart-baslik">${h.baslik}</h4>
                </div>
                <div>
                    <button type="button" class="haber-kart-butonu btn-sil" onclick="haberModul.sil(${i})">Sil</button>
                </div>
            `;
            kapsayici.appendChild(div);
        });
    },

    formGonder: function(e) {
        e.preventDefault();
        const secilenTarih = document.getElementById('h-tarih').value.split('-');
        const formatliTarih = `${parseInt(secilenTarih[2])} ${FerdiAPI.aylar[parseInt(secilenTarih[1])-1]} ${secilenTarih[0]}`;
        
        const yeniHaber = {
            meta: `${formatliTarih} / ${document.getElementById('h-etiket').value}`,
            baslik: document.getElementById('h-baslik').value
        };

        this.liste.unshift(yeniHaber);
        this.listele();
        this.githubaGonder();
        document.getElementById('form-yeni-haber').reset();
    },

    sil: function(i) {
        if(!confirm("Silinsin mi?")) return;
        this.liste.splice(i, 1);
        this.listele();
        this.githubaGonder();
    },

    githubaGonder: async function() {
        const url = `https://api.github.com/repos/${FerdiAPI.owner}/${FerdiAPI.repo}/contents/${this.path}`;
        const payload = {
            message: "Panel: Haber listesi güncellendi",
            content: FerdiAPI.utf8_to_b64(JSON.stringify(this.liste, null, 2)),
            sha: this.sha
        };
        try {
            const res = await fetch(url, {
                method: "PUT",
                headers: { "Authorization": `token ${FerdiAPI.token}`, "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const resData = await res.json();
            this.sha = resData.content.sha;
            FerdiAPI.bildirim("Haberler GitHub'a güncellendi!", "success");
        } catch(e) { FerdiAPI.bildirim("Kayıt başarısız", "error"); }
    }
};

haberModul.init();
</script>
