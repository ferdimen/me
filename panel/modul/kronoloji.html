<!-- Form Tasarımı -->
<h3 id="kro-form-baslik">⏳ Yeni Kronoloji Maddesi Ekle</h3>
<form id="form-kronoloji" onsubmit="kronolojiModul.formGonder(event)">
    <!-- Düzenleme modu için gizli index alanı -->
    <input type="hidden" id="kro-index" value="-1">
    
    <div class="form-row">
        <div class="form-group">
            <label>Yıl</label>
            <input type="number" id="kro-yil" placeholder="Örn: 2026" required min="1900" max="2100">
        </div>
        <div class="form-group">
            <label>İkon / Emoji</label>
            <input type="text" id="kro-ikon" placeholder="Örn: 🚲, 🗺️, 🛠️" required>
        </div>
    </div>
    
    <div class="form-group">
        <label>Açıklama / Olay</label>
        <textarea id="kro-tanim" rows="3" placeholder="O sene ne oldu? Kısa bir özet yazın..." required style="width: 100%; padding: 8px; border: 1px solid #e2e8f0; border-radius: 6px; font-family: inherit; resize: vertical; box-sizing: border-box;"></textarea>
    </div>
    
    <div style="display: flex; gap: 10px;">
        <button type="submit" id="btn-kro-kaydet" class="btn" style="background:#10b981;">Listeye Ekle</button>
        <button type="button" id="btn-kro-iptal" class="btn" style="background:#64748b; display:none;" onclick="kronolojiModul.duzenlemeyiIptalEt()">İptal Et</button>
    </div>
</form>

<hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 25px 0;">

<h3>📋 Mevcut Kronoloji</h3>
<!-- Kronoloji listesinin basılacağı kapsayıcı -->
<div id="kronoloji-listesi-kapsayici" style="margin-top:15px; display:flex; flex-direction:column; gap:10px;"></div>

<!-- Modül Stilleri (Ana sayfayı etkilemez, sadece bu modüle özeldir) -->
<style>
    .kro-kart {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 6px;
        padding: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: all 0.2s;
    }
    .kro-kart:hover {
        border-color: #cbd5e1;
        background: #f1f5f9;
    }
    .kro-detay {
        display: flex;
        gap: 15px;
        align-items: center;
    }
    .kro-yil-badge {
        background: #2563eb;
        color: white;
        padding: 4px 8px;
        border-radius: 4px;
        font-weight: bold;
        font-size: 13px;
    }
    .kro-ikon-alan {
        font-size: 20px;
    }
    .kro-metin {
        font-size: 14px;
        color: #334155;
        line-height: 1.4;
    }
    .kro-aksiyonlar {
        display: flex;
        gap: 5px;
    }
    .kro-btn {
        padding: 6px 10px;
        font-size: 12px;
        border-radius: 4px;
        cursor: pointer;
        border: none;
        font-weight: bold;
    }
    .kro-btn-duzenle { background: #e2e8f0; color: #334155; }
    .kro-btn-duzenle:hover { background: #cbd5e1; }
    .kro-btn-sil { background: #fee2e2; color: #b91c1c; }
    .kro-btn-sil:hover { background: #fca5a5; }
</style>

<!-- Modülün Kendi İzole Mantığı -->
<script>
const kronolojiModul = {
    path: "data/kronoloji.json", // GitHub'daki JSON dosyasının yolu
    sha: "",
    liste: [],

    // 1. Modül ilk yüklendiğinde çalışacak fonksiyon
    init: async function() {
        const url = `https://api.github.com/repos/${FerdiAPI.owner}/${FerdiAPI.repo}/contents/${this.path}`;
        try {
            const res = await fetch(url, { headers: { "Authorization": `token ${FerdiAPI.token}` } });
            if(!res.ok) return;
            const data = await res.json();
            this.sha = data.sha;
            
            // Base64'ten çözüp yerel listeye aktar
            this.liste = JSON.parse(FerdiAPI.b64_to_utf8(data.content));
            
            // Yıla göre büyükten küçüğe sırala (en güncel en üstte olsun istersen)
            this.sirala();
            this.listele();
        } catch(e) { 
            console.error("Kronoloji verisi yüklenirken hata oluştu:", e); 
        }
    },

    // 2. Listeyi yıla göre sıralar
    sirala: function() {
        this.liste.sort((a, b) => parseInt(b.yil) - parseInt(a.yil));
    },

    // 3. Verileri DOM'a basan fonksiyon
    listele: function() {
        const kapsayici = document.getElementById('kronoloji-listesi-kapsayici');
        kapsayici.innerHTML = "";
        
        if(this.liste.length === 0) {
            kapsayici.innerHTML = `<p style="color:#64748b; font-style:italic; font-size:14px;">Henüz kronoloji maddesi bulunmuyor.</p>`;
            return;
        }

        this.liste.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'kro-kart';
            div.innerHTML = `
                <div class="kro-detay">
                    <span class="kro-yil-badge">${item.yil}</span>
                    <span class="kro-ikon-alan">${item.ikon}</span>
                    <span class="kro-metin">${item.tanim}</span>
                </div>
                <div class="kro-aksiyonlar">
                    <button type="button" class="kro-btn kro-btn-duzenle" onclick="kronolojiModul.duzenle(${index})">Düzenle</button>
                    <button type="button" class="kro-btn kro-btn-sil" onclick="kronolojiModul.sil(${index})">Sil</button>
                </div>
            `;
            kapsayici.appendChild(div);
        });
    },

    // 4. Form gönderildiğinde (Ekleme veya Güncelleme)
    formGonder: function(e) {
        e.preventDefault();
        
        const index = parseInt(document.getElementById('kro-index').value);
        const yeniMadde = {
            yil: document.getElementById('kro-yil').value,
            ikon: document.getElementById('kro-ikon').value,
            tanim: document.getElementById('kro-tanim').value
        };

        if(index === -1) {
            // Yeni ekleme modu
            this.liste.push(yeniMadde);
        } else {
            // Düzenleme modu
            this.liste[index] = yeniMadde;
        }

        this.sirala();
        this.listele();
        this.githubaGonder();
        this.duzenlemeyiIptalEt(); // Formu sıfırla ve eski haline getir
    },

    // 5. Düzenleme modunu açar
    duzenle: function(index) {
        const item = this.liste[index];
        document.getElementById('kro-index').value = index;
        document.getElementById('kro-yil').value = item.yil;
        document.getElementById('kro-ikon').value = item.ikon;
        document.getElementById('kro-tanim').value = item.tanim;

        // Form başlığını ve buton metnini güncelle
        document.getElementById('kro-form-baslik').innerText = "📝 Kronoloji Maddesini Düzenle";
        document.getElementById('btn-kro-kaydet').innerText = "Değişiklikleri Kaydet";
        document.getElementById('btn-kro-kaydet').style.background = "#2563eb";
        document.getElementById('btn-kro-iptal').style.display = "inline-block";
        
        // Sayfayı forma doğru hafifçe kaydır
        document.getElementById('form-kronoloji').scrollIntoView({ behavior: 'smooth' });
    },

    // 6. Düzenleme modundan çıkış / Form sıfırlama
    duzenlemeyiIptalEt: function() {
        document.getElementById('form-kronoloji').reset();
        document.getElementById('kro-index').value = "-1";
        document.getElementById('kro-form-baslik').innerText = "⏳ Yeni Kronoloji Maddesi Ekle";
        document.getElementById('btn-kro-kaydet').innerText = "Listeye Ekle";
        document.getElementById('btn-kro-kaydet').style.background = "#10b981";
        document.getElementById('btn-kro-iptal').style.display = "none";
    },

    // 7. Listeden madde siler
    sil: function(index) {
        if(!confirm("Bu kronoloji maddesini silmek istediğinize emin misiniz?")) return;
        
        this.liste.splice(index, 1);
        this.listele();
        this.githubaGonder();
        
        // Eğer silinen eleman o sırada düzenleniyorsa formu sıfırla
        if(parseInt(document.getElementById('kro-index').value) === index) {
            this.duzenlemeyiIptalEt();
        }
    },

    // 8. Değişiklikleri GitHub'a yazar
    githubaGonder: async function() {
        const url = `https://api.github.com/repos/${FerdiAPI.owner}/${FerdiAPI.repo}/contents/${this.path}`;
        
        const payload = {
            message: "Panel: Kronoloji güncellendi",
            content: FerdiAPI.utf8_to_b64(JSON.stringify(this.liste, null, 2)),
            sha: this.sha
        };

        try {
            const res = await fetch(url, {
                method: "PUT",
                headers: { 
                    "Authorization": `token ${FerdiAPI.token}`, 
                    "Content-Type": "application/json" 
                },
                body: JSON.stringify(payload)
            });
            
            if(!res.ok) throw new Error();
            
            const resData = await res.json();
            this.sha = resData.content.sha; // Güncel SHA değerini hafızaya al
            FerdiAPI.bildirim("Kronoloji başarıyla GitHub'a kaydedildi!", "success");
        } catch(e) { 
            FerdiAPI.bildirim("Kronoloji kaydedilirken hata oluştu!", "error"); 
        }
    }
};

// Modül yüklenir yüklenmez init mekanizmasını tetikle
kronolojiModul.init();
</script>
