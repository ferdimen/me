<!-- Form Tasarımı -->
<form id="form-nerdeyim" onsubmit="nerdeyimModul.kaydet(event)">
    <fieldset>
        <legend>📍 Canlı Konum & Aktif Tur Ayarları</legend>
        <div class="form-row">
            <div class="form-group">
                <label>Aktif Tur Var mı?</label>
                <select id="aktifTur">
                    <option value="evet">Evet, Yoldayım</option>
                    <option value="hayir">Hayır, Evdeyim</option>
                </select>
            </div>
            <div class="form-group">
                <label>Tur Adı</label>
                <input type="text" id="tur-adi" placeholder="Örn: Anadolu Engereği">
            </div>
        </div>
        <div class="form-group">
            <label>Canlı Takip iframe/Harita URL</label>
            <input type="text" id="canliTakipUrl">
        </div>
        <button type="submit" class="btn">Konumu Güncelle</button>
    </fieldset>
</form>

<!-- Modülün Kendi İzole Mantığı -->
<script>
const nerdeyimModul = {
    path: "nerdeyim/konum.json",
    sha: "",

    init: async function() {
        const url = `https://api.github.com/repos/${FerdiAPI.owner}/${FerdiAPI.repo}/contents/${this.path}`;
        try {
            const res = await fetch(url, { headers: { "Authorization": `token ${FerdiAPI.token}` } });
            if(!res.ok) return;
            const data = await res.json();
            this.sha = data.sha;
            
            const json = JSON.parse(FerdiAPI.b64_to_utf8(data.content));
            
            // Elemanları Doldur
            document.getElementById('aktifTur').value = json["aktifTur"] || "hayir";
            document.getElementById('tur-adi').value = json["tur-adi"] || "";
            document.getElementById('canliTakipUrl').value = json["canliTakipUrl"] || "";
        } catch(e) { console.error("Konum yüklenemedi", e); }
    },

    kaydet: async function(e) {
        e.preventDefault();
        const url = `https://api.github.com/repos/${FerdiAPI.owner}/${FerdiAPI.repo}/contents/${this.path}`;
        
        const guncelJson = {
            "aktifTur": document.getElementById('aktifTur').value,
            "tur-adi": document.getElementById('tur-adi').value,
            "canliTakipUrl": document.getElementById('canliTakipUrl').value
        };

        const payload = {
            message: "Panel: Konum güncellendi",
            content: FerdiAPI.utf8_to_b64(JSON.stringify(guncelJson, null, 2)),
            sha: this.sha
        };

        try {
            const res = await fetch(url, {
                method: "PUT",
                headers: { "Authorization": `token ${FerdiAPI.token}`, "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            if(!res.ok) throw new Error();
            const resData = await res.json();
            this.sha = resData.content.sha;
            FerdiAPI.bildirim("Konum başarıyla kaydedildi!", "success");
        } catch(err) { FerdiAPI.bildirim("Hata oluştu", "error"); }
    }
};

// Modül yüklenir yüklenmez verileri çekmesi için tetikliyoruz
nerdeyimModul.init();
</script>
