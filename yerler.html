<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Gezilecek Yerler Haritası</title>
    <!-- Leaflet ve MarkerCluster Kütüphaneleri -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <!-- Leaflet Fullscreen Eklentisi -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-fullscreen@1.0.2/dist/leaflet.fullscreen.css" />
	  <link rel="stylesheet" href="data/style.css">
    <style>
        body { display: flex; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #sidebar { width: 320px; height: 100vh; overflow-y: auto; border-right: 1px solid #ddd; background: #fff; box-shadow: 2px 0 5px rgba(0,0,0,0.1); }
        #map { flex-grow: 1; height: 100vh; }
        
        /* Tümünü Seç Alanı */
        .select-all-container { padding: 15px; background: #eaeaea; border-bottom: 2px solid #ccc; font-weight: bold; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        
        /* Kategori Satırı (Tıklanabilir) */
        .cat-row { display: flex; align-items: center; padding: 12px 15px; background: #f4f4f4; border-bottom: 1px solid #ddd; transition: 0.3s; cursor: pointer; user-select: none; }
        .cat-row:hover { background: #e9e9e9; }
        .cat-label { display: flex; align-items: center; flex-grow: 1; font-weight: bold; }
        .cat-icon { width: 24px; height: 24px; margin: 0 10px; border-radius: 4px; object-fit: contain; }
        
        /* Mekan Listesi */
        .place-list { padding-left: 0; background: #fafafa; }
        .place-item { padding: 10px 20px 10px 45px; cursor: pointer; font-size: 13px; border-bottom: 1px solid #f9f9f9; color: #555; display: flex; align-items: center; }
        .place-item:hover { background: #f0f7ff; color: #007bff; }
        .hidden { display: none; }
        
        /* Popup Düzenlemeleri */
        .popup-content-box {
            max-height: 150px;       
            overflow-y: auto;        
            padding-right: 5px;      
            margin-bottom: 8px;
            font-size: 13px;
            line-height: 1.4;
            color: #333;
        }
        .popup-img { 
            max-width: 100%; 
            display: block; 
            margin-bottom: 8px; 
            border-radius: 4px; 
        }
        .btn-container { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; }
        .gmaps-btn { display: inline-block; background-color: #1a73e8; color: #ffffff !important; padding: 5px 8px; font-size: 11px; text-decoration: none; border-radius: 4px; font-weight: 500; }
        .gmaps-btn:hover { background-color: #1557b0; }
        .geomaps-btn { display: inline-block; background-color: #34a853; color: #ffffff !important; padding: 5px 8px; font-size: 11px; text-decoration: none; border-radius: 4px; font-weight: 500; }
        .geomaps-btn:hover { background-color: #2b8643; }
    </style>
</head>
<body>
<header class="main-header"></header>
<script src="data/header-loader.js"></script>
<div id="sidebar">
    <!-- Tümünü Seç / Kaldır Kontrolü -->
    <div class="select-all-container">
        <input type="checkbox" id="select-all-checkbox" checked>
        <label for="select-all-checkbox" style="cursor: pointer; width: 100%;">Tümünü Seç / Kaldır</label>
    </div>
    <div id="category-container"></div>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<!-- Leaflet Fullscreen Eklentisi Scripti -->
<script src="https://unpkg.com/leaflet-fullscreen@1.0.2/dist/Leaflet.fullscreen.min.js"></script>

<script>
    // Altlık haritalar (Base Layers)
    var osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap contributors'
    });

    var opentopoLayer = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
        maxZoom: 17,
        attribution: 'Map data: © OpenStreetMap contributors, SRTM | Map style: © OpenTopoMap (CC-BY-SA)'
    });

    var map = L.map('map', {
        center: [39.1667, 35.6667],
        zoom: 6,
        layers: [osmLayer], // Varsayılan olarak OpenStreetMap açılır
        fullscreenControl: true,
        fullscreenControlOptions: {
            position: 'topright'
        }
    });

    // Katman Seçici (Layer Control)
    var baseLayers = {
        "OpenStreetMap": osmLayer,
        "OpenTopoMap": opentopoLayer
    };

    L.control.layers(baseLayers).addTo(map);

    var markersGroup = L.markerClusterGroup();
    map.addLayer(markersGroup);

    let categoryCheckboxes = [];

    // Önce ana kategoriler listesini çekiyoruz
    fetch('data/yerler/kategoriler.json')
        .then(res => res.json())
        .then(mainData => {
            const container = document.getElementById('category-container');
            
            // Kategorileri "baslik" alanına göre Türkçe alfabetik (A-Z) sıralıyoruz
            mainData.categories.sort((a, b) => {
                const baslikA = a.baslik || "";
                const baslikB = b.baslik || "";
                return baslikA.localeCompare(baslikB, 'tr', { sensitivity: 'base' });
            });

            // Sıralanan diziyi döngüye sokup alt JSON dosyalarını asenkron yüklüyoruz
            mainData.categories.forEach((catMeta) => {
                fetch(catMeta.jsonPath)
                    .then(res => res.json())
                    .then(cat => {
                        const iconUrl = cat.category_icon || 'https://cdn-icons-png.flaticon.com/32/684/684908.png';
                        cat.markers = [];

                        // Kategori altındaki mekanları isme göre Türkçe alfabetik (A-Z) sıralıyoruz
                        if (cat.places && Array.isArray(cat.places)) {
                            cat.places.sort((a, b) => {
                                const nameA = a.name || "";
                                const nameB = b.name || "";
                                return nameA.localeCompare(nameB, 'tr', { sensitivity: 'base' });
                            });
                        }

                        // Kategori Satırı
                        const catRow = document.createElement('div');
                        catRow.className = 'cat-row';
                        
                        const checkbox = document.createElement('input');
                        checkbox.type = 'checkbox';
                        checkbox.checked = true; // Varsayılan olarak seçili geliyor
                        categoryCheckboxes.push(checkbox);

                        const labelDiv = document.createElement('div');
                        labelDiv.className = 'cat-label';
                        labelDiv.innerHTML = `<img src="${iconUrl}" class="cat-icon"> <span>${catMeta.baslik || cat.category_name}</span>`;
                        
                        // Checkbox harita markerlarını yönetir
                        checkbox.onchange = (e) => {
                            e.stopPropagation(); 
                            cat.markers.forEach(m => {
                                if (checkbox.checked) {
                                    markersGroup.addLayer(m);
                                } else {
                                    markersGroup.removeLayer(m);
                                }
                            });
                            updateSelectAllState();
                        };

                        labelDiv.prepend(checkbox);
                        catRow.appendChild(labelDiv);
                        
                        // Mekan Listesi (Varsayılan olarak 'hidden' yani kapalı)
                        const list = document.createElement('div');
                        list.className = 'place-list hidden';
                        
                        // Kategori başlığına (satırına) tıklandığında liste açılıp kapanır
                        catRow.onclick = () => {
                            list.classList.toggle('hidden');
                        };

                        container.appendChild(catRow);
                        
                        // Sıralanmış mekanları döngüye al
                        cat.places.forEach(place => {
                            const item = document.createElement('div');
                            item.className = 'place-item';
                            item.innerText = place.name;
                            
                            const categoryIcon = L.icon({
                                iconUrl: iconUrl,
                                iconSize: [30, 30],
                                iconAnchor: [15, 30],
                                popupAnchor: [0, -30]
                            });

                            const marker = L.marker([place.coordinates.lat, place.coordinates.lng], {
                                icon: categoryIcon
                            });

                            const gmapsUrl = `https://www.google.com/maps/search/?api=1&query=${place.coordinates.lat},${place.coordinates.lng}`;
                            const geoUrl = `geo:${place.coordinates.lat},${place.coordinates.lng}?q=${place.coordinates.lat},${place.coordinates.lng}(${encodeURIComponent(place.name)})`;

                            let popupContent = `<h3>${place.name}</h3>`;
                            if (place.description) popupContent += `<div class="popup-content-box">${place.description}</div>`;
                            if (place.image_url) popupContent += `<img src="${place.image_url}" class="popup-img">`;
                            popupContent += `
                                <div class="btn-container">
                                    <a href="${gmapsUrl}" target="_blank" class="gmaps-btn">📍 Google Haritalar</a>
                                    <a href="${geoUrl}" class="geomaps-btn">🧭 Harita Uygulamasında Aç</a>
                                </div>`;
                            
                            marker.bindPopup(popupContent);
                            
                            // Varsayılan olarak seçili olduğu için harita kümesine doğrudan ekliyoruz
                            markersGroup.addLayer(marker);
                            cat.markers.push(marker);

                            // Listeden tıklanınca haritada göster
                            item.onclick = (e) => {
                                e.stopPropagation(); 
                                if (!checkbox.checked) {
                                    checkbox.checked = true;
                                    checkbox.onchange({ stopPropagation: () => {} });
                                }
                                map.setView([place.coordinates.lat, place.coordinates.lng], 14);
                                marker.openPopup();
                            };
                            list.appendChild(item);
                        });
                        container.appendChild(list);
                    })
                    .catch(err => console.error(`${catMeta.jsonPath} yüklenemedi:`, err));
            });
        })
        .catch(err => console.error("kategoriler.json okunamadı:", err));

    const selectAllCheckbox = document.getElementById('select-all-checkbox');
    selectAllCheckbox.onchange = () => {
        const isChecked = selectAllCheckbox.checked;
        categoryCheckboxes.forEach(cb => {
            if (cb.checked !== isChecked) {
                cb.checked = isChecked;
                cb.onchange({ stopPropagation: () => {} });
            }
        });
    };

    function updateSelectAllState() {
        const allChecked = categoryCheckboxes.length > 0 && categoryCheckboxes.every(cb => cb.checked);
        const someChecked = categoryCheckboxes.some(cb => cb.checked);
        selectAllCheckbox.checked = allChecked;
        selectAllCheckbox.indeterminate = someChecked && !allChecked;
    }
</script>
</body>
</html>
