<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ganos Bisiklet - Rota Portalı</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Leaflet Fullscreen CSS -->
  <link rel="stylesheet" href="https://api.mapbox.com/mapbox.js/plugins/leaflet-fullscreen/v1.0.1/leaflet-fullscreen.css" />
  <!-- Portal Stil Dosyası -->
  <link rel="stylesheet" href="data/style.css">
</head>
<body>

  <div id="app-container">
    <!-- SOL MENÜ -->
    <div id="sidebar" class="sidebar-container">
      <div class="sidebar-header">
        <h2 style="margin: 0; font-size: 1.15rem; color: #0f172a;">🗺️ Rota Arşivi</h2>
        <p style="margin: 4px 0 0 0; font-size: 0.8rem; color: #64748b;">Turlar ve Etap Listesi</p>
      </div>
      <div id="categoryContainer"></div>
    </div>

    <!-- HARİTA & GRAFİK ALANI -->
    <div id="map-container">
      <div id="map"></div>
      
      <!-- YÜKSEKLİK GRAFİĞİ -->
      <div id="elevation-panel">
        <canvas id="elevationChart"></canvas>
      </div>
    </div>
  </div>

  <!-- GPX İNDİRME MODALI -->
  <div id="loginModal" class="modal" style="display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); align-items: center; justify-content: center;">
    <div class="modal-content" style="background-color: #fff; padding: 24px; border-radius: 12px; max-width: 420px; width: 90%; text-align: center;">
      <h3 style="margin-top: 0; color: #1e293b;">🔒 GPX İndirme Erişimi</h3>
      <p style="color: #475569; font-size: 0.9rem; margin-bottom: 20px;">GPX iz kayıtlarını indirmek için yetkili oturum açmanız gerekmektedir.</p>
      <a href="../ozel.html?redirect=rotalar.html" style="display: inline-block; background-color: #2563eb; color: #fff; text-decoration: none; padding: 12px 20px; border-radius: 8px; font-weight: bold;">🔑 Giriş Yap</a>
      <div style="margin-top: 15px;">
        <button onclick="closeLoginModal()" style="background: none; border: none; color: #64748b; cursor: pointer; text-decoration: underline;">Kapat</button>
      </div>
    </div>
  </div>

  <!-- KÜTÜPHANELER -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Fullscreen Eklentisi -->
  <script src="https://api.mapbox.com/mapbox.js/plugins/leaflet-fullscreen/v1.0.1/Leaflet.fullscreen.min.js"></script>
  <!-- Chart.js Grafikler İçi -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <script src="data/portal.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initMap();
      loadPortal();
    });

    function closeLoginModal() {
      const modal = document.getElementById('loginModal');
      if (modal) modal.style.display = 'none';
    }
  </script>
</body>
</html>
